[project]
name = "servesync"
version = "1.2.0"
description = "ServeSync - volunteer management for nonprofits (FBLA Coding & Programming 2026-2027)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6==6.11.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt", "ruff", "mypy", "pyinstaller==6.22.3"]

# ----------------------------------------------------------------- testing
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
qt_api = "pyside6"
# Fail on deprecated APIs (e.g. sqlite3 date adapters) and on leaked database handles.
filterwarnings = ["error::DeprecationWarning", "error::ResourceWarning"]

# ----------------------------------------------------------------- linting
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters in user-facing text

# ---------------------------------------------------------------- typing
[tool.mypy]
python_version = "3.10"
strict = true
packages = ["servesync"]
